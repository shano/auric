[project]
name = "auric"
version = "0.1.0"
description = "Linux/GNOME AI tool usage tracker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "tomli-w>=1.0",
]

# System packages required (Fedora):
#   sudo dnf install python3-gobject libayatana-appindicator-gtk3
# Venv setup (use system Python so gi is accessible):
#   uv venv --python /usr/bin/python3.14 --system-site-packages .venv
#   uv sync --dev

[project.scripts]
auric = "auric.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.coverage.run]
source = ["auric"]
omit = ["auric/views/*", "auric/main.py", "auric/app.py", "auric/container.py"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
targets = ["auric"]
severity = "medium"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.0",
]
