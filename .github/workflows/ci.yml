name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python /usr/bin/python3 --system-site-packages .venv
      - run: uv sync --dev
      - run: uv run ruff check auric/
      - run: uv run ruff format --check auric/
      - run: uv run bandit -r auric/ -ll --quiet

  test-ubuntu:
    name: Test / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python /usr/bin/python3 --system-site-packages .venv
      - run: uv sync --dev
      - run: uv run pytest --cov --cov-report=term-missing

  test-fedora:
    name: Test / Fedora ${{ matrix.version }}
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [40, 41]
    steps:
      - name: Install prerequisites
        run: dnf install -y git curl python3-gobject python3-gobject-base gtk3
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: uv venv --python /usr/bin/python3 --system-site-packages .venv
      - run: uv sync --dev
      - run: uv run pytest --cov --cov-report=term-missing

  test-arch:
    name: Test / Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install prerequisites
        run: pacman -Syu --noconfirm git curl python-gobject gtk3
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: uv venv --python /usr/bin/python3 --system-site-packages .venv
      - run: uv sync --dev
      - run: uv run pytest --cov --cov-report=term-missing
