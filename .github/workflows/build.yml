name: Build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag (e.g. v0.1.0)"

permissions:
  contents: write

jobs:
  wheel:
    name: Build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - name: Upload to release
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rpm:
    name: Build RPM (Fedora 41)
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install build deps
        run: |
          dnf install -y git curl python3-devel python3-hatchling \
            pyproject-rpm-macros python3-gobject rpm-build rpmdevtools
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Build source tarball
        run: uv build --sdist
      - name: Patch spec version
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#auric-v}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/auric.spec
      - name: Build RPM
        run: |
          rpmdev-setuptree
          cp packaging/auric.spec ~/rpmbuild/SPECS/
          cp dist/auric-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -br --nodeps ~/rpmbuild/SPECS/auric.spec || true
          dnf install -y ~/rpmbuild/SRPMS/*.buildreqs.nosrc.rpm
          rpmbuild -bb ~/rpmbuild/SPECS/auric.spec
      - name: Upload to release
        run: |
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
          gh release upload "${{ inputs.tag }}" *.rpm --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
